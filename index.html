<!DOCTYPE html>
<html lang="en" class="wa-theme-default wa-palette-default wa-brand-blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Use any map image as a live GPS map. Local-first, no account required." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d21" />
  <title>Custom Maps</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <script>
    // Set light/dark before first paint to avoid a flash; src/ui/colorScheme.ts keeps it in sync.
    document.documentElement.classList.add(
      matchMedia('(prefers-color-scheme: dark)').matches ? 'wa-dark' : 'wa-light');
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
